name: Avisos MIS GESTIONES

on:
  schedule:
    # Cada 30 minutos de 16:00 a 22:59 UTC (17:00–00:00 en Madrid en invierno)
    - cron: '*/30 16-22 * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: notificaciones
        run: npm install --no-audit --no-fund
      - name: Enviar avisos
        working-directory: notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node enviar.js
